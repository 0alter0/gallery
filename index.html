
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Art Gallery</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    height: 100vh;
    overflow: hidden;
    background: #111;
    font-family: Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
}

#background {
    position: fixed;
    inset: -40px;
    background-position: center;
    background-size: cover;
    filter: blur(35px) brightness(0.4);
    transform: scale(1.1);
    z-index: -1;
}

#artwork {
    max-width: 85vw;
    max-height: 85vh;
    object-fit: contain;
    border-radius: 4px;
    box-shadow: 0 10px 50px #0008;
    transition: opacity 0.2s;
}

.arrow {
    position: fixed;
    top: 50%;
    transform: translateY(-50%);
    width: 55px;
    height: 55px;
    border: none;
    border-radius: 50%;
    background: #ffffff18;
    color: white;
    font-size: 30px;
    cursor: pointer;
    backdrop-filter: blur(10px);
    transition: background 0.2s, transform 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
}

.arrow:hover {
    background: #ffffff35;
    transform: translateY(-50%) scale(1.1);
}

#previous {
    left: 30px;
}

#next {
    right: 30px;
}

#info {
    position: fixed;
    bottom: 25px;
    text-align: center;
    color: white;
}

#name {
    font-size: 16px;
    margin-bottom: 6px;
}

#counter {
    font-size: 12px;
    opacity: 0.55;
    letter-spacing: 2px;
}
</style>
</head>

<body>

<div id="background"></div>

<img id="artwork" alt="Artwork">

<button class="arrow" id="previous" onclick="changeImage(-1)">‹</button>
<button class="arrow" id="next" onclick="changeImage(1)">›</button>

<div id="info">
    <div id="name">Loading...</div>
    <div id="counter"></div>
</div>

<script>
let images = [];
let currentIndex = 0;

const artwork = document.getElementById("artwork");
const background = document.getElementById("background");
const nameDisplay = document.getElementById("name");
const counter = document.getElementById("counter");

function getDisplayName(filename) {
    return filename
        .replace(/\.png$/i, "")
        .replace(/_/g, " ");
}

function showImage(index) {
    if (index < 0 || index >= images.length) return;

    const image = new Image();

    image.onload = () => {
        currentIndex = index;

        artwork.style.opacity = 0;

        setTimeout(() => {
            artwork.src = image.src;
            background.style.backgroundImage = `url("${image.src}")`;
            artwork.style.opacity = 1;

            nameDisplay.textContent = getDisplayName(images[index]);
            counter.textContent = `${index + 1} / ${images.length}`;
        }, 150);
    };

    image.onerror = () => {
        nameDisplay.textContent = "Unable to load image";
    };

    image.src = `/pictures/${encodeURIComponent(images[index])}`;
}

function changeImage(direction) {
    showImage(currentIndex + direction);
}

document.addEventListener("keydown", event => {
    if (event.key === "ArrowLeft") changeImage(-1);
    if (event.key === "ArrowRight") changeImage(1);
});

async function initializeGallery() {
    try {
        const response = await fetch("/pictures/");
        if (!response.ok) throw new Error("Directory unavailable");

        const html = await response.text();
        const documentParser = new DOMParser();
        const page = documentParser.parseFromString(html, "text/html");

        images = [...page.querySelectorAll("a")]
            .map(link => decodeURIComponent(link.getAttribute("href") || ""))
            .filter(name => /^[^/]+\.png$/i.test(name))
            .sort((a, b) => a.localeCompare(b, undefined, {
                sensitivity: "base",
                numeric: true
            }));

        if (!images.length) {
            nameDisplay.textContent = "No artwork found";
            return;
        }

        showImage(0);

    } catch (error) {
        nameDisplay.textContent = "Could not retrieve images";
        console.error(error);
    }
}

initializeGallery();
</script>

</body>
</html>
